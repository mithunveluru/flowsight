services:
  receipt-ocr:
    container_name: flowsight-receipt-ocr
    build:
      # Pinned to a specific commit for reproducible builds. Bump this SHA to
      # pull upstream changes; vendor/fork the service if it needs local patches.
      context: https://github.com/bhimrazy/receipt-ocr.git#ac1c5fcd9c0d6fcea27aa2a39d2fd2ff54914a24:app
    environment:
      OPENAI_API_KEY: ${GROQ_API_KEY:-placeholder}
      OPENAI_BASE_URL: https://api.groq.com/openai/v1
      OPENAI_MODEL: ${RECEIPT_OCR_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: flowsight-postgres
    environment:
      POSTGRES_DB: flowsight
      POSTGRES_USER: flowsight
      # no default: compose refuses to start without a real password in .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      # loopback only: the database is never reachable from the LAN
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowsight-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flowsight
      DB_USERNAME: flowsight
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET}
      # short-lived access token; sessions persist via rotating refresh tokens
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-1209600000}
      # Web app + Tauri desktop (dev server 1420 and tauri://localhost / http://tauri.localhost webview origins)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3007,http://localhost:1420,tauri://localhost,http://tauri.localhost}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RECEIPT_OCR_URL: ${RECEIPT_OCR_URL:-http://receipt-ocr:8000}
      RECEIPT_OCR_BACKOFF: ${RECEIPT_OCR_BACKOFF:-10m}
      # local stack serves models out of the box; every ML call still falls back to rules
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-local-dev-ml-token}
      # capability switches must match the ml-service container's
      ML_OCR_ENABLED: ${ML_OCR_ENABLED:-true}
      ML_OCR_TIMEOUT: ${ML_OCR_TIMEOUT:-60s}
      ML_CATEGORIZER_ENABLED: ${ML_CATEGORIZER_ENABLED:-true}
      ML_CATEGORIZER_SHADOW: ${ML_CATEGORIZER_SHADOW:-false}
      ML_MERCHANT_EMBEDDINGS_ENABLED: ${ML_MERCHANT_EMBEDDINGS_ENABLED:-true}
      OCR_TESSERACT_LANGUAGES: ${OCR_TESSERACT_LANGUAGES:-eng}
      GROQ_MERCHANT_MODEL: ${GROQ_MERCHANT_MODEL:-openai/gpt-oss-20b,llama-3.1-8b-instant}
      MERCHANT_LLM_ENABLED: ${MERCHANT_LLM_ENABLED:-false}
      MERCHANT_LLM_MODEL: ${MERCHANT_LLM_MODEL:-}
      # Email delivery. gmail (SMTP, local dev), brevo (HTTPS, works where SMTP
      # is blocked e.g. Render), or resend. Switch with EMAIL_PROVIDER.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-FlowSight}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-FlowSight <noreply@flowsight.app>}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3007}
      PASSWORD_RESET_EXPIRATION_MINUTES: ${PASSWORD_RESET_EXPIRATION_MINUTES:-30}
      # DEV ONLY: returns the reset link in the /forgot-password response so the
      # flow is testable without a verified email domain. Keep false in prod.
      PASSWORD_RESET_DEV_EXPOSE_LINK: ${PASSWORD_RESET_DEV_EXPOSE_LINK:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      receipt-ocr:
        condition: service_started
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
    container_name: flowsight-ml-service
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-local-dev-ml-token}
      ML_MODEL_DIR: /models
      ML_OCR_ENABLED: ${ML_OCR_ENABLED:-true}
      ML_OCR_LLM_ENABLED: ${ML_OCR_LLM_ENABLED:-false}
      ML_OCR_LLM_MODEL: ${ML_OCR_LLM_MODEL:-}
      ML_OCR_LLM_API_KEY: ${GROQ_API_KEY:-}
      ML_CATEGORIZER_ENABLED: ${ML_CATEGORIZER_ENABLED:-true}
      ML_CATEGORIZER_SHADOW: ${ML_CATEGORIZER_SHADOW:-false}
      ML_MERCHANT_EMBEDDINGS_ENABLED: ${ML_MERCHANT_EMBEDDINGS_ENABLED:-true}
    volumes:
      - ml_models:/models
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowsight-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:3007:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ml_models:
