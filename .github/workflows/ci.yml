name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowsight_test
          POSTGRES_USER: flowsight
          POSTGRES_PASSWORD: ci_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        run: mvn verify -q
        env:
          DB_URL: jdbc:postgresql://localhost:5432/flowsight_test
          DB_USERNAME: flowsight
          DB_PASSWORD: ci_test_password
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'Y2lfdGVzdF9zZWNyZXRfa2V5X21pbmltdW1fMjU2X2JpdHNfbG9uZ19wbGFjZWhvbGRlcg==' }}

      - name: Build Docker image
        run: docker build -t flowsight-backend:ci .

  frontend:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Build Docker image
        run: docker build -t flowsight-frontend:ci .

  desktop:
    name: Desktop - Type check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      # the desktop app compiles shared modules from ../frontend through the @ alias
      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Type check
        run: npm run type-check --prefix desktop

      - name: Build
        run: npm run build --prefix desktop

  ml-service:
    name: ML service - Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t flowsight-ml-service:ci .
